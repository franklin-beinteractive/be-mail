<!doctype html>
<html>
  <body>
    <pre id="out"></pre>
    <script type="module">
      import { initialsOf, avatarColor } from "/src/components/Avatar.tsx";

      const lines = [];
      let fails = 0;
      function check(name, cond, extra) {
        if (!cond) fails++;
        lines.push(`${cond ? "PASS" : "FAIL"}  ${name}${cond ? "" : "  -> " + extra}`);
      }
      const eq = (name, got, want) => check(`${name} = ${want}`, got === want, got);

      eq("Bart van Esch", initialsOf("Bart van Esch"), "BE");
      eq("Jeroen Evers", initialsOf("Jeroen Evers"), "JE");
      eq("Sentry BE-Interactive", initialsOf("Sentry BE-Interactive"), "SB");
      eq("Ramenfabriek (1 woord)", initialsOf("Ramenfabriek"), "R");
      eq("Op 't Hoog", initialsOf("Op 't Hoog"), "OH");
      eq("Raymond de Loefstop", initialsOf("Raymond de Loefstop"), "RL");
      eq("alleen adres", initialsOf(null, "sentry@be-interactive.nl"), "S");
      eq("naam gaat voor adres", initialsOf("Kiki Oorschot", "info@x.nl"), "KO");
      eq("leeg", initialsOf("", ""), "?");
      eq("alleen leestekens", initialsOf("<>", "@"), "?");
      eq("accenten", initialsOf("Émile Zola"), "ÉZ");
      eq("komma-notatie", initialsOf("Esch, Bart van"), "EB");

      const c1 = avatarColor("bart@x.nl");
      check("kleur is stabiel", c1 === avatarColor("bart@x.nl"), c1);
      check("kleur negeert hoofdletters", c1 === avatarColor("Bart@X.nl"), avatarColor("Bart@X.nl"));
      check("kleur is een hex-kleur", /^#[0-9a-f]{6}$/i.test(c1), c1);
      const spread = new Set(
        ["a@x.nl", "b@x.nl", "c@x.nl", "d@x.nl", "e@x.nl", "f@x.nl"].map(avatarColor)
      );
      check("verschillende afzenders krijgen spreiding", spread.size >= 4, [...spread].join());

      lines.push(fails === 0 ? "ALL TESTS PASSED" : `${fails} TEST(S) FAILED`);
      document.getElementById("out").textContent = lines.join("\n");
    </script>
  </body>
</html>
