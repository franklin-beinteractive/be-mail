[package]
name = "be-mail"
version = "0.1.0"
description = "Simpele, snelle en veilige e-mail- en agenda-client voor Office 365"
authors = ["Be Interactive"]
edition = "2021"

[lib]
# De `_lib`-suffix is nodig zodat de lib-naam uniek is en niet botst met de bin-naam (Windows).
name = "be_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Opdrachten-module: kopieerknoppen voor mailsjablonen (nooit zelf versturen).
tauri-plugin-clipboard-manager = "2"
# Bestandskiezer voor export/import (back-up van instellingen + assignments).
# Alleen om een pad te kiezen; lezen/schrijven doet de Rust-kern met std::fs.
tauri-plugin-dialog = "2"
# Auto-updater: haalt ondertekende bundels + latest.json op uit de GitHub-releases
# van deze repo en herstart na installatie (zie tauri.conf.json + capabilities).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# keyring staat als per-OS dependency onderaan: elk platform heeft zijn eigen
# credential-backend (zie de [target.*.dependencies]-tabellen hieronder).
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
webbrowser = "1"
dirs = "5"
# Offline cache (mail lezen zonder netwerk); "bundled" compileert SQLite mee,
# dus geen systeemafhankelijkheid.
rusqlite = { version = "0.32", features = ["bundled"] }

# Credential-store per platform. De token-chunking in token_store.rs is
# backend-agnostisch (portable keyring::Entry-API) en werkt overal ongewijzigd.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# crypto-rust vermijdt een systeem-OpenSSL-afhankelijkheid voor secret-service.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
# Kleinere, snellere binary.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
