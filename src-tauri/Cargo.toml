[package]
name = "be-mail"
version = "0.1.0"
description = "Simpele, snelle en veilige e-mail- en agenda-client voor Office 365"
authors = ["Be Interactive"]
edition = "2021"

[lib]
# De `_lib`-suffix is nodig zodat de lib-naam uniek is en niet botst met de bin-naam (Windows).
name = "be_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Opdrachten-module: kopieerknoppen voor mailsjablonen (nooit zelf versturen).
tauri-plugin-clipboard-manager = "2"
# Bestandskiezer voor export/import (back-up van instellingen + assignments).
# Alleen om een pad te kiezen; lezen/schrijven doet de Rust-kern met std::fs.
tauri-plugin-dialog = "2"
# Auto-updater: haalt ondertekende bundels + latest.json op uit de GitHub-releases
# van deze repo en herstart na installatie (zie tauri.conf.json + capabilities).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# keyring staat als per-OS dependency onderaan: elk platform heeft zijn eigen
# credential-backend (zie de [target.*.dependencies]-tabellen hieronder).
# NB: Linux vereist runtime een Secret Service-daemon (gnome-keyring/KWallet).
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
webbrowser = "1"
dirs = "5"
# Offline cache (read mail without a network); "bundled" compiles SQLite in,
# so there is no system dependency. 0.42 bundles a SQLite past
# RUSTSEC-2026-0459.
rusqlite = { version = "0.42", features = ["bundled"] }
# --- IMAP-accounts (Fase 3/4) ---
# Sync IMAP-client zonder eigen TLS (default-features uit = geen native-tls/OpenSSL);
# we voeren zelf een rustls-stream aan, consistent met reqwest elders.
imap = { version = "2", default-features = false }
# rustls met ring (geen aws-lc-sys/NASM-buildvereiste op Windows); expliciete
# provider in lib.rs voorkomt de "geen default CryptoProvider"-paniek.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
# RFC822/MIME-parser: fetched bericht -> Message-model.
mail-parser = "0.11"
# IMAP modified-UTF-7 mapnamen decoderen/encoderen (RFC 3501).
utf7-imap = "0.3"
# SMTP-verzending + MIME-opbouw. rustls met ring (geen aws-lc-rs/OpenSSL),
# consistent met de rest van de build.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
    "hostname",
] }
# --- CalDAV-agenda voor IMAP-accounts (Fase 5) ---
# Alle pure-Rust (geen OpenSSL/aws-lc): HTTP loopt via reqwest (rustls/ring).
# quick-xml: streaming parser voor de PROPFIND/REPORT multistatus-antwoorden.
quick-xml = "0.41"
# icalendar: opbouwen en parsen van VCALENDAR/VEVENT (.ics).
icalendar = "0.17"
# rrule: herhalingen client-side uitklappen als de server geen <C:expand> kan.
rrule = "0.14"
# chrono-tz: DST-correcte IANA-tijdzones (UTC <-> Europe/Amsterdam enz.).
chrono-tz = "0.10"
# uuid: verse UID's voor nieuwe .ics-bestanden.
uuid = { version = "1", features = ["v4"] }
# percent-encoding: veilige href-/URL-onderdelen bij CalDAV-PUT/DELETE.
percent-encoding = "2"

# Credential-store per platform. De token-chunking in token_store.rs is
# backend-agnostisch (portable keyring::Entry-API) en werkt overal ongewijzigd.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# crypto-rust vermijdt een systeem-OpenSSL-afhankelijkheid voor secret-service.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
# Kleinere, snellere binary.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
